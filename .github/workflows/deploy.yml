name: Compile Solidity & Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compile Game.sol & Generate contract-artifact.json
        run: |
          npm install --no-save solc@0.8.20
          node -e '
            const fs = require("fs");
            const solc = require("solc");
            const source = fs.readFileSync("Game.sol", "utf8");
            const input = {
              language: "Solidity",
              sources: { "Game.sol": { content: source } },
              settings: {
                optimizer: { enabled: true, runs: 200 },
                outputSelection: { "*": { "*": ["abi", "evm.bytecode.object"] } }
              }
            };
            const output = JSON.parse(solc.compile(JSON.stringify(input)));
            if (output.errors) {
              const fatal = output.errors.filter(e => e.severity === "error");
              output.errors.forEach(e => console.log(e.formattedMessage));
              if (fatal.length > 0) process.exit(1);
            }
            const contract = output.contracts["Game.sol"]["SherlockTreasureHunt"];
            const artifact = {
              contractName: "SherlockTreasureHunt",
              compiler: solc.version(),
              abi: contract.abi,
              bytecode: "0x" + contract.evm.bytecode.object
            };
            fs.writeFileSync("abi.json", JSON.stringify(contract.abi, null, 2));
            fs.writeFileSync("contract-artifact.json", JSON.stringify(artifact, null, 2));
            console.log("Compiled SherlockTreasureHunt successfully! Bytecode length:", artifact.bytecode.length);
          '

      - name: Validate Frontend JS Syntax
        run: node --check app.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Static Site Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
